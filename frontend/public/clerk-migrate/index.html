<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveBridge Clerk Migration</title>
<style>
body{font-family:Arial,sans-serif;background:#081423;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(760px,92vw);background:#111d2d;border:1px solid #2c3b4f;border-radius:18px;padding:28px}
input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid #33445c;background:#07111d;color:#fff;margin:10px 0 14px}
button{background:#2588ff;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
pre{white-space:pre-wrap;background:#08111e;padding:16px;border-radius:10px;overflow:auto;min-height:70px}
.muted{color:#a8b8ca}
</style>
</head>
<body>
<div class="card">
  <h1>LiveBridge Clerk Migration</h1>
  <p class="muted">Build: clerk-migrate-v6</p>
  <p>No Clerk sign-in is required. Enter the one-time migration key, then run once.</p>
  <input id="key" type="password" placeholder="One-time migration key">
  <button id="run" type="button">Run Migration</button>
  <pre id="result">Waiting…</pre>
</div>

<script>
const BACKEND="https://livebridge-clerk-production-backend-test.northstarventures-ca.workers.dev";
const runBtn=document.getElementById("run");
const resultEl=document.getElementById("result");
const keyEl=document.getElementById("key");

window.onerror=function(message,source,lineno,colno,error){
  resultEl.textContent="PAGE ERROR: "+message+" at "+lineno+":"+colno;
};
window.onunhandledrejection=function(event){
  resultEl.textContent="UNHANDLED ERROR: "+(event.reason?.message||event.reason||"Unknown error");
};

runBtn.addEventListener("click", async ()=>{
  runBtn.disabled=true;
  resultEl.textContent="CLICK RECEIVED — calling migration backend…";

  try{
    const token=String(keyEl.value||"").trim();

    if(!token){
      throw new Error("Enter the one-time migration key first.");
    }

    const response=await fetch(BACKEND+"/admin/clerk-migrate-users",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:"{}"
    });

    const raw=await response.text();

    let data;
    try{
      data=JSON.parse(raw);
    }catch{
      throw new Error("Backend returned HTTP "+response.status+" with non-JSON response: "+raw.slice(0,500));
    }

    resultEl.textContent=JSON.stringify(data,null,2);
  }catch(err){
    resultEl.textContent="MIGRATION ERROR: "+(err.message||String(err));
  }finally{
    runBtn.disabled=false;
  }
});
</script>
</body>
</html>
