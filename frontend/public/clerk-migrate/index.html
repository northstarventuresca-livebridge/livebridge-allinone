<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveBridge Clerk Migration</title>
<style>
body{font-family:Arial,sans-serif;background:#081423;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(760px,92vw);background:#111d2d;border:1px solid #2c3b4f;border-radius:18px;padding:28px}
button{background:#2588ff;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
pre{white-space:pre-wrap;background:#08111e;padding:16px;border-radius:10px;overflow:auto;min-height:40px}
.muted{color:#a8b8ca}
#signin{margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>LiveBridge Clerk Migration</h1>
  <p class="muted">Production Clerk user migration utility. This page exists only on the staging Worker.</p>
  <p id="status">Loading Clerk…</p>
  <div id="signin"></div>
  <button id="run" disabled>Run Migration</button>
  <pre id="result"></pre>
</div>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubGl2ZWJyaWRnZS5jYSQ"
  src="https://clerk.livebridge.ca/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
</script>

<script>
const BACKEND="https://livebridge-clerk-production-backend-test.northstarventures-ca.workers.dev";
const statusEl=document.getElementById("status");
const runBtn=document.getElementById("run");
const resultEl=document.getElementById("result");
const signInEl=document.getElementById("signin");

async function getActiveSession(){
  await Clerk.load();

  const sessions =
    Clerk.client?.sessions ||
    Clerk.client?.signedInSessions ||
    [];

  let session =
    Clerk.session ||
    sessions.find(s=>s.status==="active") ||
    sessions[0] ||
    null;

  if(session && Clerk.session?.id !== session.id){
    await Clerk.setActive({session:session.id});
  }

  return session;
}

async function refreshState(){
  try{
    const session=await getActiveSession();
    const user=Clerk.user || session?.user || null;

    if(!session || !user){
      statusEl.textContent="Sign in with one of the existing LiveBridge account emails to run the migration.";
      runBtn.disabled=true;
      signInEl.innerHTML="";
      Clerk.mountSignIn(signInEl,{
        routing:"hash",
        forceRedirectUrl:window.location.href,
        fallbackRedirectUrl:window.location.href
      });
      return;
    }

    try{ Clerk.unmountSignIn(signInEl); }catch{}
    signInEl.innerHTML="";

    const email =
      user.primaryEmailAddress?.emailAddress ||
      user.emailAddresses?.[0]?.emailAddress ||
      "signed-in user";

    statusEl.textContent="Signed in as "+email+". Ready.";
    runBtn.disabled=false;
  }catch(err){
    statusEl.textContent="Unable to load Clerk: "+(err.message||err);
    runBtn.disabled=true;
  }
}

window.addEventListener("load",refreshState);

runBtn.addEventListener("click",async()=>{
  runBtn.disabled=true;
  resultEl.textContent="Running migration…";
  try{
    const session=await getActiveSession();
    if(!session) throw new Error("No active Production Clerk session.");

    const token=await session.getToken();

    const response=await fetch(BACKEND+"/admin/clerk-migrate-users",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
      }
    });

    let data=null;
    try{
      data=await response.json();
    }catch{
      throw new Error("Migration backend returned a non-JSON response (HTTP "+response.status+").");
    }

    resultEl.textContent=JSON.stringify(data,null,2);
  }catch(err){
    resultEl.textContent="Migration request failed: "+(err.message||err);
  }finally{
    runBtn.disabled=false;
  }
});
</script>
</body>
</html>
