<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveBridge Clerk Migration</title>
<style>
body{font-family:Arial,sans-serif;background:#081423;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(760px,92vw);background:#111d2d;border:1px solid #2c3b4f;border-radius:18px;padding:28px}
button{background:#2588ff;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;margin-right:8px}
button:disabled{opacity:.5;cursor:not-allowed}
pre{white-space:pre-wrap;background:#08111e;padding:16px;border-radius:10px;overflow:auto;min-height:70px}
.muted{color:#a8b8ca}.ok{color:#72f0b1}.err{color:#ff9b9b}
#signin{margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>LiveBridge Clerk Migration</h1>
  <p class="muted">Build: clerk-migrate-v4</p>
  <p id="status">Loading Production Clerk…</p>
  <div id="signin"></div>
  <button id="refresh" type="button" onclick="refreshState()">Refresh Sign-in</button>
  <button id="run" type="button" onclick="runMigration()" disabled>Run Migration</button>
  <pre id="result">Waiting…</pre>
</div>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubGl2ZWJyaWRnZS5jYSQ"
  src="https://clerk.livebridge.ca/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
</script>

<script>
const BACKEND="https://livebridge-clerk-production-backend-test.northstarventures-ca.workers.dev";
const statusEl=document.getElementById("status");
const runBtn=document.getElementById("run");
const resultEl=document.getElementById("result");
const signInEl=document.getElementById("signin");

window.onerror=function(message,source,lineno,colno,error){
  resultEl.textContent="PAGE ERROR: "+message+" at "+lineno+":"+colno;
};
window.onunhandledrejection=function(event){
  resultEl.textContent="UNHANDLED ERROR: "+(event.reason?.message||event.reason||"Unknown error");
};

async function waitForClerk(){
  for(let i=0;i<50;i++){
    if(window.Clerk) return true;
    await new Promise(r=>setTimeout(r,100));
  }
  throw new Error("Production Clerk script did not load.");
}

async function getActiveSession(){
  await waitForClerk();
  await Clerk.load();

  const sessions =
    Clerk.client?.sessions ||
    Clerk.client?.signedInSessions ||
    [];

  let session =
    Clerk.session ||
    sessions.find(s=>s.status==="active") ||
    sessions[0] ||
    null;

  if(session && Clerk.session?.id !== session.id){
    await Clerk.setActive({session:session.id});
  }

  return session;
}

async function refreshState(){
  runBtn.disabled=true;
  resultEl.textContent="Checking Production Clerk session…";

  try{
    const session=await getActiveSession();
    const user=Clerk.user || session?.user || null;

    if(!session || !user){
      statusEl.textContent="Not signed in. Use the form below.";
      resultEl.textContent="Sign in with one of the existing LiveBridge account emails, then press Refresh Sign-in.";
      signInEl.innerHTML="";
      Clerk.mountSignIn(signInEl,{
        routing:"hash",
        forceRedirectUrl:window.location.href.split("#")[0],
        fallbackRedirectUrl:window.location.href.split("#")[0]
      });
      return;
    }

    try{ Clerk.unmountSignIn(signInEl); }catch(e){}
    signInEl.innerHTML="";

    const email =
      user.primaryEmailAddress?.emailAddress ||
      user.emailAddresses?.[0]?.emailAddress ||
      "signed-in user";

    statusEl.textContent="Signed in as "+email+". Ready.";
    resultEl.textContent="Ready. Press Run Migration once.";
    runBtn.disabled=false;
  }catch(err){
    statusEl.textContent="Unable to initialize Production Clerk.";
    resultEl.textContent="INIT ERROR: "+(err.message||String(err));
  }
}

async function runMigration(){
  runBtn.disabled=true;
  resultEl.textContent="CLICK RECEIVED — starting migration…";

  try{
    const session=await getActiveSession();

    if(!session){
      throw new Error("No active Production Clerk session. Press Refresh Sign-in.");
    }

    resultEl.textContent="Session found. Creating authorization token…";
    const token=await session.getToken();

    if(!token){
      throw new Error("Clerk returned no session token.");
    }

    resultEl.textContent="Token created. Calling staging migration backend…";

    const response=await fetch(BACKEND+"/admin/clerk-migrate-users",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:"{}"
    });

    resultEl.textContent="Backend responded HTTP "+response.status+". Reading result…";

    const raw=await response.text();
    let data;
    try{ data=JSON.parse(raw); }
    catch(e){ throw new Error("Backend returned non-JSON: "+raw.slice(0,500)); }

    resultEl.textContent=JSON.stringify(data,null,2);
  }catch(err){
    resultEl.textContent="MIGRATION ERROR: "+(err.message||String(err));
  }finally{
    runBtn.disabled=false;
  }
}

window.addEventListener("load",refreshState);
</script>
</body>
</html>
