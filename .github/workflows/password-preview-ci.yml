name: LiveBridge password preview syntax
on:
  pull_request:
    paths:
      - 'test-preview/password-login-preview-worker.mjs'
      - 'tests/password-preview-smoke.mjs'
      - '.github/workflows/password-preview-ci.yml'
  push:
    branches: [main]
    paths:
      - 'test-preview/password-login-preview-worker.mjs'
      - 'tests/password-preview-smoke.mjs'
      - '.github/workflows/password-preview-ci.yml'
permissions:
  contents: read
jobs:
  check-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check test-preview/password-login-preview-worker.mjs
      - run: node tests/password-preview-smoke.mjs
