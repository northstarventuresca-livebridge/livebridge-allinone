name: One-time LiveBridge listener experience upgrade

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/livebridge-listener-experience-v1.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and validate listener experience upgrade
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '   ' | base64 --decode > /tmp/livebridge_patch.py
          python3 /tmp/livebridge_patch.py

          node --check backend/worker.js

          printf '%s' '' | base64 --decode > /tmp/livebridge_validate.py
          python3 /tmp/livebridge_validate.py

          grep -q 'listenerDataDisplay' backend/worker.js
          grep -q 'type: "presence"' backend/worker.js
          grep -q 'type: "chat"' backend/worker.js
          grep -q 'listener-profile' backend/worker.js
          grep -q 'editListenerDataDisplay' frontend/public/admin/index.html
          grep -q 'Data this visit' frontend/public/t/index.html
          grep -q 'With You' frontend/public/t/index.html

          git config user.name "LiveBridge Automation"
          git config user.email "actions@users.noreply.github.com"

          git add             backend/worker.js             frontend/public/admin/index.html             frontend/public/t/index.html

          git rm .github/workflows/livebridge-listener-experience-v1.yml

          git commit -m "Add listener presence chat profiles and data meter"
          git push origin main
