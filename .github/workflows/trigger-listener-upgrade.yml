name: Inspect listener upgrade patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-listener-upgrade.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode and inspect patch around syntax error
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          source = Path('.github/workflows/livebridge-listener-experience-v1.yml').read_text(encoding='utf-8')
          matches = re.findall(r"printf '%s' '([^']+)' \| base64 --decode > /tmp/(livebridge_[A-Za-z0-9_-]+\.py)", source)
          wanted = {name: payload for payload, name in matches if name == 'livebridge_patch.py'}
          payload = wanted['livebridge_patch.py']
          cleaned = ''.join(payload.split())
          cleaned += '=' * ((4 - len(cleaned) % 4) % 4)
          Path('/tmp/livebridge_patch.py').write_bytes(base64.b64decode(cleaned))
          PY
          nl -ba /tmp/livebridge_patch.py | sed -n '135,220p'
          python3 -m py_compile /tmp/livebridge_patch.py
