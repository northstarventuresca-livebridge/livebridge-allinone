name: Apply listener experience upgrade

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-listener-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and validate listener experience upgrade
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          listener_path = Path("scripts/lb_listener_upgrade.py")
          listener = listener_path.read_text(encoding="utf-8")
          old = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)'''
          new = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if label == "listener chat CSS":
                  if count < 1:
                      raise RuntimeError(f"{label}: expected at least 1 match, found {count}")
                  return text.replace(old, new, 1)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)'''
          if old not in listener:
              raise SystemExit("Could not patch listener CSS match guard")
          listener_path.write_text(listener.replace(old, new, 1), encoding="utf-8")

          backend_path = Path("scripts/lb_backend_listener_upgrade.py")
          backend = backend_path.read_text(encoding="utf-8")
          old_regex = 'new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)'
          new_regex = 'new_text, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)'
          if old_regex not in backend:
              raise SystemExit("Could not patch backend regex replacement guard")
          backend_path.write_text(backend.replace(old_regex, new_regex, 1), encoding="utf-8")
          PY

          python3 -m py_compile scripts/lb_backend_listener_upgrade.py
          python3 -m py_compile scripts/lb_admin_listener_upgrade.py
          python3 -m py_compile scripts/lb_listener_upgrade.py

          python3 scripts/lb_backend_listener_upgrade.py
          python3 scripts/lb_admin_listener_upgrade.py
          python3 scripts/lb_listener_upgrade.py

          node --check backend/worker.js

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          for page in [Path("frontend/public/admin/index.html"), Path("frontend/public/t/index.html")]:
              text = page.read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", text, flags=re.I | re.S)
              checked = 0
              for index, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  temp = Path(f"/tmp/{page.parent.name}-inline-{index}.js")
                  temp.write_text(script, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(temp)], capture_output=True, text=True)
                  if result.returncode != 0:
                      print(result.stdout)
                      print(result.stderr)
                      raise SystemExit(f"Inline JS syntax failed: {page} script {index}")
                  checked += 1
              print(f"{page}: {checked} inline scripts validated")
          PY

          grep -q 'listenerDataDisplay' backend/worker.js
          grep -q 'type: "presence"' backend/worker.js
          grep -q 'type: "chat"' backend/worker.js
          grep -q 'url.pathname === "/listener-profile"' backend/worker.js
          grep -q 'assignedName' backend/worker.js
          grep -q 'id="editListenerDataDisplay"' frontend/public/admin/index.html
          grep -q 'Site Admin only' frontend/public/admin/index.html
          grep -q 'id="listenerChatPanel"' frontend/public/t/index.html
          grep -q 'Data this visit:' frontend/public/t/index.html
          grep -q 'With You:' frontend/public/t/index.html
          grep -q 'saveListenerProfile' frontend/public/t/index.html

          git config user.name "LiveBridge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/worker.js frontend/public/admin/index.html frontend/public/t/index.html
          if git diff --cached --quiet; then
            echo "No LiveBridge code changes were produced."
            exit 1
          fi
          git commit -m "Add listener presence chat profiles and data meter"
          git push origin main
