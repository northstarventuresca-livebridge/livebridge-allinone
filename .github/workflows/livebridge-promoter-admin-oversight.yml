name: One-time LiveBridge promoter admin oversight upgrade

on:
  push:
    branches:
      - promoter-portal
    paths:
      - '.github/workflows/livebridge-promoter-admin-oversight.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out promoter portal branch
        uses: actions/checkout@v4
        with:
          ref: promoter-portal
          fetch-depth: 0

      - name: Apply promoter admin oversight upgrade
        run: python .github/scripts/livebridge_promoter_admin_upgrade.py

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check backend/promoter.js
          python -c "import re,pathlib; t=pathlib.Path('frontend/public/promoter-admin/index.html').read_text(encoding='utf-8'); s=[x for x in re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', t, flags=re.S) if x.strip()]; pathlib.Path('/tmp/promoter-admin-inline.js').write_text(s[-1], encoding='utf-8')"
          node --check /tmp/promoter-admin-inline.js

      - name: Commit upgraded portal and remove one-time files
        shell: bash
        run: |
          rm -f .github/workflows/livebridge-promoter-admin-oversight.yml
          rm -f .github/scripts/livebridge_promoter_admin_upgrade.py
          git config user.name "LiveBridge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add full promoter admin oversight"
          git push origin HEAD:promoter-portal
