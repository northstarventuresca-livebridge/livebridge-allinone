name: One-time LiveBridge admin employee link

on:
  push:
    paths:
      - '.github/workflows/livebridge-admin-employee-link.yml'

permissions:
  contents: write

jobs:
  update-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add employee promoter management button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/public/admin/index.html')
          text = path.read_text(encoding='utf-8')

          button = '''      <button
            class="lb-side-button"
            type="button"
            onclick="window.open('https://livebridge-promoter-frontend-test.northstarventures-ca.workers.dev/promoter-admin/','_blank','noopener')"
          >
            👥 Employee / Promoter Management
          </button>

'''

          if '👥 Employee / Promoter Management' not in text:
              needle = '''      <div class="lb-divider"></div>'''
              if needle not in text:
                  raise SystemExit('Expected admin sidebar divider was not found; refusing to modify.')
              text = text.replace(needle, button + needle, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit admin update and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/livebridge-admin-employee-link.yml
          git config user.name "LiveBridge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/admin/index.html .github/workflows/livebridge-admin-employee-link.yml
          git commit -m "Add employee promoter management link"
          git push origin HEAD:main
