name: LiveBridge existing-client password integration safety
on:
  pull_request:
    paths:
      - 'frontend/worker.js'
      - 'tests/frontend-password-upgrade-smoke.mjs'
      - '.github/workflows/frontend-password-upgrade-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/worker.js'
      - 'tests/frontend-password-upgrade-smoke.mjs'
      - '.github/workflows/frontend-password-upgrade-ci.yml'
permissions:
  contents: read
jobs:
  code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check frontend/worker.js
      - run: node tests/frontend-password-upgrade-smoke.mjs
